<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4銘柄 15秒足 Replay</title><style>html,body{margin:0;height:100%;background:#131722;color:#d1d4dc;font:13px system-ui,sans-serif}#bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1e222d;border-bottom:1px solid #2a2e39}input{background:#131722;color:#fff;border:1px solid #3d4352;border-radius:3px;padding:4px 7px}button{background:#2962ff;color:#fff;border:0;border-radius:3px;padding:5px 9px;cursor:pointer}.grid{height:calc(100% - 39px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}.cell{position:relative;min-width:0}.cell b{position:absolute;z-index:2;left:8px;top:6px;background:#131722cc;padding:3px 6px;border-radius:3px}.cell iframe{width:100%;height:100%;border:0}</style></head><body><div id="bar"><b>4銘柄 15秒足</b><span>日付</span><input id="date" type="date"><button id="show">表示</button><span>Z / X で4画面を同期再生</span></div><main class="grid" id="grid"></main><script>const defaults=['6981','6976','6857','1321'],names={6981:'村田製作所',6976:'太陽誘電',6857:'アドバンテスト',1321:'日経225 ETF'},p=new URLSearchParams(location.search),codes=(p.get('symbols')||defaults.join(',')).split(',').map(x=>x.trim()).filter(Boolean),dateInput=document.querySelector('#date');dateInput.value=p.get('date')||new Date().toISOString().slice(0,10);function compact(s){return s.replaceAll('-','')}function show(){const d=compact(dateInput.value),start=new Date(dateInput.value+'T00:00:00');start.setDate(start.getDate()-6);const from=`${start.getFullYear()}${String(start.getMonth()+1).padStart(2,'0')}${String(start.getDate()).padStart(2,'0')}`,grid=document.querySelector('#grid');grid.innerHTML='';codes.slice(0,4).forEach(c=>{const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<b>${c} ${names[c]||''} 15S</b><iframe src="index.html?symbol=${encodeURIComponent(c)}&from=${from}&to=${d}&embed=1"></iframe>`;grid.append(cell)})}document.querySelector('#show').onclick=show;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='codelaggy-quad-step')return;document.querySelectorAll('iframe').forEach(frame=>frame.contentWindow.postMessage({type:'codelaggy-step',delta:e.data.delta},location.origin))});show();</script></body></html>
